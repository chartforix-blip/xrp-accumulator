name: mail-alert
on:
  schedule:
    - cron: "20 10,22 * * *"
  workflow_dispatch:
permissions:
  issues: write
jobs:
  mail:
    runs-on: ubuntu-latest
    steps:
      - name: send
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, smtplib, ssl
          from email.mime.text import MIMEText
          user = os.environ.get("MAIL_USER", "").strip()
          pw = os.environ.get("MAIL_PASS", "").replace(" ", "").strip()
          to = [x.strip() for x in os.environ.get("MAIL_TO", "").replace(";", ",").replace("\n", ",").split(",") if x.strip()]
          host = os.environ.get("MAIL_HOST", "").strip() or "smtp.gmail.com"
          if not (user and pw and to):
              print("mail settings are not set; skip")
              raise SystemExit(0)
          subprocess.run(["gh", "label", "create", "mailed", "--force", "--color", "cccccc"], check=False)
          out = subprocess.run(["gh", "issue", "list", "--state", "open", "--limit", "20", "--json", "number,title,body,labels"], check=True, capture_output=True, text=True).stdout
          items = [i for i in json.loads(out) if not any(l["name"] == "mailed" for l in i["labels"])]
          print("to send", len(items), "recipients", len(to))
          if items:
              s = smtplib.SMTP_SSL(host, 465, context=ssl.create_default_context(), timeout=30)
              s.login(user, pw)
              for i in sorted(items, key=lambda x: x["number"]):
                  m = MIMEText(i["body"] or "", "plain", "utf-8")
                  m["Subject"] = i["title"]
                  m["From"] = user
                  m["To"] = user
                  s.sendmail(user, to, m.as_string())
                  subprocess.run(["gh", "issue", "edit", str(i["number"]), "--add-label", "mailed"], check=True)
                  print("sent", i["number"])
              s.quit()
          PY
