# Reads new releases, blog posts and trusted news, then rewrites the commentary, the thesis steps and the numbers. Every 3 hours.
# AI: Google Gemini free tier only. Key: Secrets GEMINI_API_KEY. Does nothing without the key.
name: auto-learn
on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auto-learn
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: learn
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 -I learn.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-auto.js data/auto.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "auto learn" && git pull --rebase && git push)
