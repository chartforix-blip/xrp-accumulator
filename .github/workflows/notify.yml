name: notify-owner
on:
  schedule:
    - cron: "20 10,22 * * *"
  workflow_dispatch:
permissions:
  issues: write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: post the alert text as a comment that mentions the owner (GitHub emails the comment)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh label create notified --force --color cccccc || true
          for n in $(gh issue list --state open --limit 30 --json number,labels --jq '.[] | select(([.labels[].name] | index("notified")) == null) | .number'); do
            gh issue view "$n" --json title,body --jq '"【" + .title + "】\n\n" + .body' > body.txt
            { echo "@$OWNER さんへのお知らせです。"; echo; cat body.txt; } > msg.txt
            gh issue comment "$n" --body-file msg.txt
            gh issue edit "$n" --add-label notified
            echo "notified $n"
          done
