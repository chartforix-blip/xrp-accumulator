# Ripple press list and blog list, every 3 hours. Keeps the old file when a fetch fails.
name: fetch-ripple-press
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          mkdir -p data
          UA="Mozilla/5.0 (compatible; personal-reader; a few requests per day)"
          curl -fsSL --max-time 60 -A "$UA" https://ripple.com/sitemap/press-release.xml -o data/new.xml || true
          if [ -s data/new.xml ] && grep -q "ripple-press" data/new.xml; then mv data/new.xml data/press-release.xml; else rm -f data/new.xml; echo "press: keep old"; fi
          curl -fsSL --max-time 60 -A "$UA" https://ripple.com/sitemap/post.xml -o data/new.xml || true
          if [ -s data/new.xml ] && grep -q "/insights/" data/new.xml; then mv data/new.xml data/post.xml; else rm -f data/new.xml; echo "post: keep old"; fi
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "update press list" && git pull --rebase && git push)
