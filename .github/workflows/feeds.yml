name: fetch-world-feeds
on:
  schedule:
    - cron: "37 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          mkdir -p data/feeds
          while read -r n u; do
            [ -z "$n" ] && continue
            curl -fsSL --max-time 40 -A "Mozilla/5.0 (compatible; personal-reader; 1 request per day)" "$u" -o "data/feeds/$n.tmp" || true
            if [ -s "data/feeds/$n.tmp" ] && grep -qiE "<item|<entry" "data/feeds/$n.tmp"; then mv "data/feeds/$n.tmp" "data/feeds/$n.xml"; echo "ok $n"; else rm -f "data/feeds/$n.tmp"; echo "failed $n"; fi
          done <<'EOF'
          fed https://www.federalreserve.gov/feeds/press_all.xml
          bis https://www.bis.org/doclist/all_pressrels.rss
          occ https://www.occ.gov/rss/occ_news.xml
          ecb https://www.ecb.europa.eu/rss/press.html
          fsa https://www.fsa.go.jp/fsaNewsListAll_rss2.xml
          boj https://www.boj.or.jp/rss/whatsnew.xml
          openai https://openai.com/news/rss.xml
          googleai https://blog.google/technology/ai/rss/
          stripe https://stripe.com/blog/feed.rss
          circle https://www.circle.com/blog/rss.xml
          coinbase https://www.coinbase.com/blog/rss.xml
          EOF
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data
          git diff --cached --quiet || (git commit -m "update world feeds" && git push)
