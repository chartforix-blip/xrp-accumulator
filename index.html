<script>
'use strict';
/* ---------- 保存 ---------- */
const LS='xrpacc.';const mem={};
function get(k,d){try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}}
function set(k,v){mem[k]=v;try{localStorage.setItem(LS+k,JSON.stringify(v));return true}catch(e){return false}}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const yen=v=>v==null||!isFinite(v)?'—':Math.round(v).toLocaleString('ja-JP')+'円';
const num=(v,d)=>v==null||!isFinite(v)?'—':Number(v).toLocaleString('ja-JP',{minimumFractionDigits:d,maximumFractionDigits:d});
const dstr=ts=>new Date(ts).toISOString().slice(0,10);

/* ---------- 設定 ---------- */
const DEF={inds:[
 {k:'val',g:'p',n:'XRPL の利用の大きさに対する値段（過去の真ん中の値に対する倍率）',u:'倍',w:14,zero:1.5,full:0.5,d:2},
 {k:'dd',g:'p',n:'過去最高値からの下落率',u:'%',w:8,zero:0,full:70,d:1},
 {k:'ma',g:'p',n:'200日移動平均に対する倍率',u:'倍',w:8,zero:1.5,full:0.7,d:2},
 {k:'pos',g:'p',n:'過去4年の値幅の中の位置',u:'%',w:6,zero:100,full:0,d:1},
 {k:'btc',g:'p',n:'XRP/BTC 比率の200日平均に対する倍率',u:'倍',w:3,zero:1.3,full:0.7,d:2},
 {k:'rsiw',g:'t',n:'週足 RSI（14）',u:'',w:3,zero:70,full:30,d:1},
 {k:'fng',g:'t',n:'恐怖と欲の指数',u:'',w:3,zero:75,full:20,d:0},
 {k:'rsid',g:'t',n:'日足 RSI（14）',u:'',w:2,zero:70,full:30,d:1},
 {k:'fund',g:'t',n:'資金調達率（直近7日の平均・8時間あたり）',u:'%',w:1,zero:0.03,full:-0.01,d:4},
 {k:'biz',g:'f',n:'事業の評価（中身の段階と、XRP への結びつき）',u:'点',w:14,zero:0,full:100,d:0},
 {k:'man',g:'f',n:'リップル社と XRP の材料（自分で付けた点）',u:'点',w:8,zero:0,full:100,d:0},
 {k:'stb',g:'f',n:'XRPL のステーブルコイン残高（RLUSD など）の90日の増減',u:'%',w:4,zero:-10,full:30,d:1},
 {k:'tvl',g:'f',n:'XRPL に預けられた資産の90日の増減（XRP の値動きを除く）',u:'%',w:4,zero:-20,full:30,d:1},
 {k:'dex',g:'f',n:'XRPL の DEX の出来高（直近30日 ÷ その前の90日）',u:'倍',w:2,zero:0.6,full:1.5,d:2},
 {k:'exch',g:'w',n:'取引所などの口座の残高の30日の増減（減る＝引き出されている）',u:'%',w:10,zero:5,full:-5,d:2},
 {k:'whale',g:'w',n:'大口の口座の残高の30日の増減（増える＝買い集めている）',u:'%',w:10,zero:-5,full:5,d:2}],
 strong:70,ok:50,minF:40,sigTh:40,budget:30000,mStrong:2,mOk:1,mSkip:0};
const GN={f:'将来性（ファンダメンタルズ）',p:'将来性と過去に対する値段の安さ',w:'大口の動き',t:'相場の過熱（短期・重みは小さい）'};
const GH={f:'高いほど、事業と利用が伸びている',p:'高いほど、今の値段が安い',w:'高いほど、大口が集めている',t:'高いほど、売られすぎ'};
const GO=['f','p','w','t'];
const HELP={
 val:'XRPL のステーブルコイン残高・預けられた資産・DEX の出来高をまとめた「利用の大きさ」で、値段を割った数字です。1倍より小さいほど、利用の伸びに値段が追いついていません。',
 dd:'今の値段が、過去のいちばん高い値段から何%下がっているかです。大きいほど安いです。',
 ma:'直近200日の平均の値段に対する、今の値段です。1倍より小さいほど、平均より安いです。',
 pos:'過去4年のいちばん安い値段を0%、いちばん高い値段を100%とした時の、今の位置です。',
 btc:'XRP の値段をビットコインの値段で割った比率を、その200日平均と比べた数字です。小さいほど、ビットコインに比べて安いです。',
 rsiw:'直近14週の上げ幅と下げ幅の割合です。30に近いほど売られすぎです。合図に使っています。',
 fng:'暗号資産の市場全体の気分を0〜100で表す数字です。小さいほど、怖がっている人が多いです。',
 rsid:'直近14日の上げ幅と下げ幅の割合です。短い期間の売られすぎを見ます。',
 fund:'先物で、買い手が売り手に払う手数料の率です。マイナスの時は、売りに傾いています。',
 biz:'事業を8つのテーマに分け、発表の中身がどの段階まで進んだか（事業の広がり）と、XRP への結びつきの確かさを合わせた点です。発表の本数は使っていません。',
 man:'下の「材料を点にする」欄で自分が選んだ5項目の合計です。',
 stb:'XRPL の上にあるドル建てのステーブルコイン（RLUSD など）の残高が、90日前から何%増えたかです。決済に使われる量の目安です。',
 tvl:'XRPL の上のサービスに預けられた資産が、90日前から何%増えたかです。XRP の値段の上げ下げの分は除いています。',
 dex:'XRPL の上の取引所（DEX）の、直近30日の1日あたりの出来高を、その前の90日と比べた数字です。1倍より大きいと増えています。',
 exch:'取引所などの口座にある XRP が、30日前から何%増減したかです。減っている時は、引き出して持つ人が多いです。',
 whale:'名前のない大口の口座にある XRP が、30日前から何%増減したかです。増えている時は、大口が買い集めています。'};
const FM=[['etf','ETF・投資商品への資金の出入り'],['reg','規制・法律（米国・日本）'],['biz','リップル社の提携・買収・免許'],['use','RLUSD・送金サービスの利用の広がり'],['risk','裁判・事故などの悪い材料（ない・解決＝良い）']];
function loadCfg(){const c=get('cfg',null);const d=JSON.parse(JSON.stringify(DEF));if(!c||!Array.isArray(c.inds))return d;
 for(const i of d.inds){const s=c.inds.find(x=>x.k===i.k);if(s){for(const f of['w','zero','full'])if(isFinite(s[f]))i[f]=Number(s[f]);}}
 for(const f of['strong','ok','minF','sigTh','budget','mStrong','mOk','mSkip'])if(isFinite(c[f]))d[f]=Number(c[f]);
 for(const f of['linkW','liq','via','turn'])if(isFinite(c[f]))d[f]=Number(c[f]);
 if(c.mk&&typeof c.mk==='object'){d.mk={};for(const k in c.mk){const u=c.mk[k]||{},o={};for(const f of['g','sh','x'])if(isFinite(u[f]))o[f]=Number(u[f]);d.mk[String(k).replace(/\W/g,'')]=o}}
 if(c.led&&typeof c.led==='object'){d.led={};for(const k in c.led){const u=c.led[k]||{},o={};for(const f of['s','f','l'])if(isFinite(u[f]))o[f]=Math.max(0,Math.min(5,Math.round(u[f])));d.led[String(k).replace(/\W/g,'')]=o}}
 if(c.view&&typeof c.view==='object'){d.view={};for(const k in c.view)if(isFinite(c.view[k]))d.view[String(k).replace(/\W/g,'')]=Number(c.view[k])}
 if(c.link&&typeof c.link==='object'){d.link={};for(const k in c.link)if(isFinite(c.link[k]))d.link[String(k).replace(/\W/g,'')]=Number(c.link[k])}return d}
let cfg=loadCfg();
let fm=get('fm',{v:{},at:''});
const fmScore=()=>{let s=50;for(const [k] of FM)s+=10*(+fm.v[k]||0);return s};
let hold=get('hold',{baseQty:0,baseAvg:0,rate:3,share:100,buys:[]});
let memo=get('memo','');
const PLAN0={goal:50000,years:10,bear:-5,base:10,bull:25,reinvest:1,events:[]};
let plan=Object.assign({},PLAN0,get('plan',{}));if(!Array.isArray(plan.events))plan.events=[];
let snaps=get('snaps',{});   // 日付 -> {tx,pay,act,escrow,supply}
const state={S:null,src:{},fund:null};

/* ---------- 取得（上限に当たったら止める） ---------- */
const blocked=get('blocked',{});
async function getJSON(host,url,body){
 if(blocked[host]&&blocked[host]>Date.now())throw new Error('上限に当たったので止めています（'+new Date(blocked[host]).toLocaleString('ja-JP')+' まで）');
 let r,err;for(let k=0;k<3;k++){try{r=await fetch(url,body?{method:'POST',body:JSON.stringify(body)}:undefined);break}catch(e){err=e;await sleep(700*(k+1))}}   // 通信の失敗は3回までやり直す
 if(!r)throw new Error('つながりませんでした（'+(err&&err.message||'通信の失敗')+'）');
 if(r.status===429||r.status===403){blocked[host]=Date.now()+6*3600e3;set('blocked',blocked);throw new Error('回数の上限（HTTP '+r.status+'）。6時間は呼びません')}
 if(!r.ok)throw new Error('HTTP '+r.status);
 return r.json();
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function candles(pair){
 const now=new Date(),thisY=now.getUTCFullYear(),td=today();let rows=[];
 for(let y=2017;y<=thisY;y++){
  const key='c.'+pair+'.'+y;let c=get(key,null);
  const fresh=c&&(c.full||(c.at&&Date.now()-c.at<600e3));   // 今年の分は10分たったら取り直す
  if(!fresh){
   try{
    const j=await getJSON('bitbank','https://public.bitbank.cc/'+pair+'/candlestick/1day/'+y);
    if(j.success===1){c={full:y<thisY,day:td,at:Date.now(),rows:j.data.candlestick[0].ohlcv.map(o=>[o[5],+o[1],+o[2],+o[3]])};set(key,c)}
    else if(j.data&&j.data.code===10009){blocked.bitbank=Date.now()+6*3600e3;set('blocked',blocked);throw new Error('回数の上限（10009）。6時間は呼びません')}
    else if(!c){c={full:false,day:td,rows:[]}}
    await sleep(150);
   }catch(e){if(!c)throw e;state.src['bitbank '+pair]={ok:false,msg:e.message+'。前に取った数字を使っています'}}
  }

 }

 let ath=0,sum=0;

function backtest(S){

 if(start<0)return null;
 const mk=()=>({days:0,inv:0,later:[],d1:0});
 const bands={strong:mk(),ok:mk(),skip:mk()},bins=Array.from({length:10},mk);
 for(let i=start;i<n;i++){const s=scv[i];if(s==null)continue;
  for(const g of[bands[band(s)],bins[Math.min(9,Math.floor(s/10))]]){g.days++;g.inv+=1/S.c[i];if(i+365<n){g.later.push(S.c[i+365]/S.c[i])}}}

 // 毎月1回の買い方の比較

 for(let i=start;i<n;i++){const d=new Date(S.ts[i]),m=d.getUTCFullYear()*12+d.getUTCMonth();if(m===lastM)continue;lastM=m;

  rule.m++;rule[b]++;const y=cfg.budget*mult(b);rule.spent+=y;rule.x+=y/S.c[i]}

}

 const r=(+hold.rate||0)/100*(+hold.share||0)/100,rows=[];let reach=null,spent=0;
 for(let m=1;m<=plan.years*12;m++){const p=p0*Math.pow(1+g/100,m/12);q+=cfg.budget/p;spent+=cfg.budget;const it=q*r/12;if(plan.reinvest)q+=it;
  const inc=q*r/12*p;if(reach==null&&plan.goal>0&&inc>=plan.goal)reach=m;if(m%12===0)rows.push({y:m/12,p,q,val:q*p,inc})}
 return {rows,reach,spent}}

function drawChart(){
 const cv=$('cv'),S=state.S,bt=state.bt;if(!cv||!bt)return;
 const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;
 const g=cv.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,W,H);
 const a=bt.start,n=S.n,L=46,R=6,T=8,B=22;let lo=Infinity,hi=0;for(let i=a;i<n;i++){lo=Math.min(lo,S.c[i]);hi=Math.max(hi,S.c[i])}
 const X=i=>L+(i-a)/(n-1-a)*(W-L-R),Y=v=>T+(Math.log(hi)-Math.log(v))/(Math.log(hi)-Math.log(lo))*(H-T-B);
 g.font='11px sans-serif';g.fillStyle='#93a4b8';g.strokeStyle='rgba(255,255,255,.09)';g.lineWidth=1;
 for(const v of[lo,Math.sqrt(lo*hi),hi]){g.beginPath();g.moveTo(L,Y(v));g.lineTo(W-R,Y(v));g.stroke();g.textAlign='right';g.textBaseline='middle';g.fillText(Math.round(v)+'円',L-4,Math.min(H-B-6,Math.max(T+6,Y(v))))}
 let ly=null,lx=-99;g.textAlign='center';g.textBaseline='alphabetic';
 for(let i=a;i<n;i++){const y=new Date(S.ts[i]).getUTCFullYear();if(y!==ly){if(ly!==null&&X(i)-lx>40&&X(i)<W-20){g.fillText(y,X(i),H-6);lx=X(i)}ly=y}}
 const col={strong:'#27d9a3',ok:'#4aa8ff',skip:'#5b6b7e'};g.lineWidth=1.6;
 for(let i=a+1;i<n;i++){g.strokeStyle=col[band(bt.scv[i])]||'#5b6b7e';g.beginPath();g.moveTo(X(i-1),Y(S.c[i-1]));g.lineTo(X(i),Y(S.c[i]));g.stroke()}
}

/* ---------- 操作 ---------- */
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.i!=null){const v=parseFloat(t.value);if(isFinite(v)){cfg.inds[+t.dataset.i][t.dataset.f]=v;set('cfg',cfg);renderAll()}}
 else if(t.dataset.c){const v=parseFloat(t.value);if(isFinite(v)){cfg[t.dataset.c]=v;set('cfg',cfg);renderAll()}}
 else if(t.dataset.h){const v=parseFloat(t.value);hold[t.dataset.h]=isFinite(v)?v:0;set('hold',hold);renderHold();renderRoad()}
 else if(t.dataset.p){let v=parseFloat(t.value);if(isFinite(v)){if(t.dataset.p==='years')v=Math.max(1,Math.min(30,Math.round(v)));plan[t.dataset.p]=v;set('plan',plan);renderRoad()}}
 else if(t.id==='memo'){memo=t.value;set('memo',memo)}
 else if(t.dataset.mk){const v=parseFloat(t.value);if(isFinite(v)){cfg.mk=cfg.mk||{};const k=t.dataset.mk;cfg.mk[k]=cfg.mk[k]||{};cfg.mk[k][t.dataset.f]=v;set('cfg',cfg);renderAll()}}
 else if(t.dataset.led){cfg.led=cfg.led||{};const k=t.dataset.led;cfg.led[k]=cfg.led[k]||{};cfg.led[k][t.dataset.f]=+t.value;set('cfg',cfg);renderAll()}
 else if(t.dataset.view){cfg.view=cfg.view||{};cfg.view[t.dataset.view]=+t.value;set('cfg',cfg);renderAll()}
 else if(t.dataset.link){cfg.link=cfg.link||{};cfg.link[t.dataset.link]=+t.value;set('cfg',cfg);renderAll()}
 else if(t.dataset.fm){fm.v[t.dataset.fm]=+t.value;fm.at=today();set('fm',fm);renderAll()}
 else if(t.id==='imp'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const j=JSON.parse(fr.result);if(j.app!=='xrp-accumulator')throw new Error('このツールのファイルではありません');
   if(j.cfg){set('cfg',j.cfg);cfg=loadCfg()}if(j.hold){hold=j.hold;if(!Array.isArray(hold.buys))hold.buys=[];set('hold',hold)}if(typeof j.memo==='string'){memo=j.memo;set('memo',memo)}if(j.plan&&typeof j.plan==='object'){plan=Object.assign({},PLAN0);for(const k of['goal','years','bear','base','bull','reinvest'])if(isFinite(j.plan[k]))plan[k]=Number(j.plan[k]);plan.events=Array.isArray(j.plan.events)?j.plan.events.map(x=>({id:String(x.id),d:String(x.d),t:String(x.t)})):[];set('plan',plan)}if(j.fm&&j.fm.v){fm={v:j.fm.v,at:String(j.fm.at||'')};set('fm',fm)}if(j.snaps&&typeof j.snaps==='object'){snaps=j.snaps;set('snaps',snaps)}
   renderAll();$('fileMsg').textContent='読み込みました（'+(j.exported||'')+' に書き出したファイル）'}catch(err){$('fileMsg').textContent='読み込めません：'+err.message}};fr.readAsText(t.files[0])}
});
function noteMode(on){document.body.classList.toggle('notes',on);$('noteBtn').textContent=on?'説明を隠す':'説明を表示'}
noteMode(get('notes',false));
document.addEventListener('click',async e=>{const t=e.target;
 if(t.id==='retry'){state.src={};load();return}
 if(t.id==='noteBtn'){const on=!document.body.classList.contains('notes');set('notes',on);noteMode(on);return}
 if(t.tagName==='H2'&&t.parentElement.tagName==='SECTION'){t.parentElement.classList.toggle('closed');if(t.parentElement.id==='test')drawChart();return}
 if(t.id==='bAdd'){const q=parseFloat($('bQty').value),p=parseFloat($('bPrice').value);if(!(q>0)||!(p>0)){alert('数量と買値を入れてください');return}
  hold.buys.push({d:$('bDate').value||today(),q,p,m:$('bMemo').value.slice(0,60)});hold.buys.sort((a,b)=>a.d<b.d?-1:1);set('hold',hold);renderHold();renderRoad()}
 else if(t.dataset.del!=null){if(confirm('この記録を消しますか？')){hold.buys.splice(+t.dataset.del,1);set('hold',hold);renderHold();renderRoad()}}
 else if(t.id==='evAdd'){const tx=$('evText').value.trim();if(!tx){alert('予定の内容を入れてください');return}plan.events.push({id:String(Date.now()),d:$('evDate').value||today(),t:tx.slice(0,60)});set('plan',plan);renderRoad()}
 else if(t.dataset.evdel!=null){plan.events=plan.events.filter(x=>String(x.id)!==t.dataset.evdel);set('plan',plan);renderRoad()}
 else if(t.id==='reset'){if(confirm('設定を初めの値に戻しますか？')){cfg=JSON.parse(JSON.stringify(DEF));set('cfg',cfg);renderAll()}}
 else if(t.id==='impBtn'){$('imp').click()}
 else if(t.id==='exp'){const data={app:'xrp-accumulator',version:1,exported:new Date().toISOString(),cfg,hold,memo,fm,plan,snaps};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));a.download='xrp-accumulator-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('fileMsg').textContent='書き出しました：'+a.download}
 else if(t.id==='reload'){const last=get('reloadAt',0);if(Date.now()-last<600e3){$('reloadMsg').textContent='取り直しは10分に1回までです';return}
  set('reloadAt',Date.now());const y=new Date().getUTCFullYear();for(const k of['c.xrp_jpy.'+y,'c.btc_jpy.'+y,'fng','fund','xs','cg','ltvl','lstb','ldex','rl','fl','stAll','defi','am','press','mkj','cg2'])   /* world（配信のためた分）は消さない */{try{localStorage.removeItem(LS+k)}catch(e){}delete mem[k]}state.src={};load()}
});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawChart,150)});

/* ---------- 読み込み ---------- */
async function load(){
 $('status').textContent='データを読み込んでいます…（初めての時は20回ほど取りに行きます）';
 try{
  const x=await candles('xrp_jpy');
  if(!x.length)throw new Error('値段のデータがありません');
  let btc=[];try{btc=await candles('btc_jpy')}catch(e){state.src['bitbank btc_jpy']={ok:false,msg:e.message}}
  try{localStorage.removeItem(LS+'xs');localStorage.removeItem(LS+'cg')}catch(e){}
  const [fng,fund,xs,cg]=await Promise.all([
   daily('fng','alternative','https://api.alternative.me/fng/?limit=0',j=>j.data.map(d=>[d.timestamp*1000,+d.value]),'恐怖と欲の指数（alternative.me）'),
   daily('fund','bybit','https://api.bybit.com/v5/market/funding/history?category=linear&symbol=XRPUSDT&limit=200',j=>{const l=j.result.list.slice(0,21).map(r=>+r.fundingRate);return l.length?l.reduce((a,b)=>a+b,0)/l.length*100:null},'資金調達率（Bybit）'),
   daily('xs','xrpscan','https://api.xrpscan.com/api/v1/statistics/metrics',j=>({date:String(j.date).slice(0,10),tx:j.metric.transaction_count,pay:j.metric.payments_count,act:j.metric.active_accounts,fee:j.metric.fee_total,amm:j.amm&&j.amm.xrp_locked}),'XRPL の利用状況（XRPScan）'),
   daily('cg2','coingecko','https://api.coingecko.com/api/v3/coins/ripple?localization=false&tickers=false&community_data=false&developer_data=false',j=>({sup:j.market_data.circulating_supply,usd:j.market_data.current_price.usd}),'流通している数とドルの値段（CoinGecko）')]);
  state.cg=cg;state.xsx=xs;
  const [ltvl,lstb,ldex]=await Promise.all([
   daily('ltvl','llama','https://api.llama.fi/v2/historicalChainTvl/XRPL',j=>j.map(d=>[d.date*1000,Math.round(d.tvl)]),'XRPL に預けられた資産（DefiLlama）'),
   daily('lstb','llama','https://stablecoins.llama.fi/stablecoincharts/XRPL',j=>j.map(d=>[d.date*1000,Math.round((d.totalCirculatingUSD&&d.totalCirculatingUSD.peggedUSD)||0)]),'XRPL のステーブルコイン残高（DefiLlama）'),
   daily('ldex','llama','https://api.llama.fi/overview/dexs/XRPL?excludeTotalDataChart=false&excludeTotalDataChartBreakdown=true',j=>(j.totalDataChart||[]).map(d=>[d[0]*1000,Math.round(d[1])]),'XRPL の DEX の出来高（DefiLlama）')]);
  const ago90=a=>{if(!a||a.length<95)return null;return {now:a[a.length-1][1],ago:a[a.length-91][1]}};
  const [rl,fl,stAll,defi,am,press]=await Promise.all([
   daily('rl','llama','https://stablecoins.llama.fi/stablecoin/250',j=>{let now=0,ago=0,xrpl=0;const cut=Date.now()/1000-90*86400;for(const [ch,v] of Object.entries(j.chainBalances||{})){const tk=v.tokens||[];if(!tk.length)continue;const val=t=>(t.circulating&&t.circulating.peggedUSD)||0,last=val(tk[tk.length-1]);now+=last;if(ch==='XRPL')xrpl=last;let a=0;for(const t of tk){if(t.date<=cut)a=val(t);else break}ago+=a}return {now,ago,xrpl}},'RLUSD の発行額（DefiLlama）'),
   daily('fl','llama','https://api.llama.fi/v2/historicalChainTvl/Flare',j=>ago90(j.map(d=>[d.date,d.tvl])),'Flare に預けられた資産（DefiLlama）'),
   daily('stAll','llama','https://stablecoins.llama.fi/stablecoincharts/all',j=>ago90(j.map(d=>[+d.date,(d.totalCirculatingUSD&&d.totalCirculatingUSD.peggedUSD)||0])),'ステーブルコインの市場全体（DefiLlama）'),
   daily('defi','llama','https://api.llama.fi/v2/historicalChainTvl',j=>ago90(j.map(d=>[d.date,d.tvl])),'DeFi の市場全体（DefiLlama）'),
   daily('am','xrpscan','https://api.xrpscan.com/api/v1/amendments',j=>j.map(a=>({n:String(a.name),e:!!a.enabled,c:+a.count||0,t:+a.threshold||0,s:!!a.supported,on:a.enabled_on?String(a.enabled_on).slice(0,10):''})),'XRPL の機能の投票（XRPScan）'),
   pressList()]);
  const world=await worldFeeds();
  state.mkj=await daily('mkj','ghpages','https://chartforix-blip.github.io/xrp-accumulator/data/markets.json',j=>Array.isArray(j)?j.slice(-800).map(h=>({d:String(h.d),lend:+h.lend||0,rwa:+h.rwa||0,bridge:+h.bridge||0})):[],'市場の数字の毎日の記録（DefiLlama を GitHub が取得）');
  Object.assign(state,{rl,fl,stAll,defi,am,press,world,xt:ago90(ltvl)});
  const S=build(x,new Map(btc.map(r=>[r[0],r[3]])),new Map(fng||[]),{tvl:new Map(ltvl||[]),stb:new Map(lstb||[]),dex:new Map(ldex||[])});
  if(fund!=null)S.ind.fund[S.n-1]=fund;state.fund=fund;
  if(xs&&xs.date){snaps[xs.date]=Object.assign(snaps[xs.date]||{},{tx:xs.tx,pay:xs.pay,act:xs.act},cg&&cg.sup?{supply:cg.sup}:{});set('snaps',snaps)}
  state.S=S;renderAll();
  $('status').textContent='大口の動きを取っています…（1日1回・60回ほど取りに行きます）';
  const wh=await whales();state.wh=wh;
  if(wh){if(wh.exch&&wh.exch.pct!=null)S.ind.exch[S.n-1]=wh.exch.pct;if(wh.whale&&wh.whale.pct!=null)S.ind.whale[S.n-1]=wh.whale.pct;
   snaps[wh.day]=Object.assign(snaps[wh.day]||{},{escrow:wh.escrow});set('snaps',snaps)}
  renderAll();
  const bad=Object.values(state.src).filter(v=>!v.ok).length;
  $('status').textContent='表示：'+new Date().toLocaleString('ja-JP')+(bad?'　取れなかったデータが '+bad+' つあります（下の「データの出どころ」を見てください）':'');
 }catch(e){const local=!/^https?:$/.test(location.protocol);
  $('status').innerHTML='<span class="bad">データを取れませんでした：'+esc(e.message)+'。'+(local?'この画面はネットにつながらないプレビューの可能性があります。https://chartforix-blip.github.io/xrp-accumulator/ を開いてください。':'電波の良い所で、下のボタンを押してください。')+'</span> <button id="retry" type="button">もう一度取りに行く</button>'}
}
load();
</script>
